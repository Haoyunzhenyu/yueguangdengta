<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务规划计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#6366F1',
                        neutral: '#F3F4F6',
                        dark: '#1F2937',
                        // 新增：定义类别文字色值（红色、黄色）
                        categoryRed: '#EF4444',
                        categoryYellow: '#F59E0B'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .input-focus {
                @apply focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none;
            }
            .result-card {
                @apply bg-white rounded-lg p-4 shadow-sm border border-gray-100 transition-all duration-300 hover:shadow-md relative;
            }
            /* 保留背景样式，仅新增文字颜色类 */
            .card-category {
                @apply absolute top-2 left-2 w-6 h-6 rounded-full bg-primary/20 flex items-center justify-center text-xs font-bold;
            }
            .category-he { /* 核：红色文字 */
                @apply text-categoryRed;
            }
            .category-gang { /* 刚：黄色文字 */
                @apply text-categoryYellow;
            }
            .category-tan { /* 弹：蓝色文字（默认primary，不变） */
                @apply text-primary;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-dark">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <!-- 标题区域 -->
        <div class="text-center mb-8">
            <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark mb-2">
                <i class="fa fa-calculator text-primary mr-2"></i>财务规划计算器
            </h1>
            <p class="text-gray-500 text-sm">输入金额，自动计算规划结果</p>
        </div>

        <!-- 输入区域 -->
        <div class="bg-white rounded-xl p-6 shadow-md mb-8 transform transition-all duration-300 hover:shadow-lg">
            <div class="mb-4">
                <label for="inputNumber" class="block text-sm font-medium text-gray-700 mb-2">输入金额</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fa fa-yen"></i>
                    </span>
                    <input 
                        type="number" 
                        id="inputNumber" 
                        class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 input-focus text-lg"
                        placeholder="请输入金额"
                        step="any"
                    >
                </div>
            </div>
            <button 
                id="calculateBtn" 
                class="w-full bg-primary hover:bg-secondary text-white font-medium py-3 px-4 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 shadow-md hover:shadow-lg"
            >
                <i class="fa fa-cog"></i>
                <span>开始计算</span>
            </button>
        </div>

        <!-- 结果区域 -->
        <div id="resultContainer" class="hidden">
            <h2 class="text-lg font-semibold mb-4 flex items-center">
                <i class="fa fa-bar-chart text-primary mr-2"></i>
                计算结果
            </h2>
            <div class="grid grid-cols-2 gap-3" id="resultsGrid">
                <!-- 结果卡片将动态生成 -->
            </div>
            
            <!-- 总和验证 -->
            <div class="mt-6 bg-neutral rounded-lg p-4 border border-gray-200">
                <div class="flex justify-between items-center">
                    <span class="font-medium">总和验证：</span>
                    <span id="totalSum" class="text-primary font-semibold"></span>
                </div>
                <p class="text-xs text-gray-500 mt-1">（应与输入金额一致，存在微小误差属正常现象）</p>
            </div>

            <!-- 特殊使用规则：移至验算下方，拉近间距，默认隐藏 -->
            <div id="ruleContainer" class="hidden mt-4 bg-neutral rounded-xl p-5 border border-gray-200">
                <h3 class="text-md font-semibold mb-3 flex items-center text-dark">
                    <i class="fa fa-info-circle text-primary mr-2"></i>钱袋子特殊使用规则
                </h3>
                <div class="space-y-2 text-xs text-gray-700">
                    <p><strong class="text-primary">核心储蓄袋（只进不出）</strong>：应急备用金、长期目标、专项支出，任何情况不得挪用，应急备用金攒满1w后，30%比例1:1划入长期/专项。</p>
                    <p><strong class="text-primary">刚性灵活袋（专款专用，不互通）</strong>：购物基金、旅游基金，年度上限各2000元，攒满后溢出金额划入核心储蓄袋，不得互相借用或填补日常/人情。</p>
                    <p><strong class="text-primary">弹性灵活袋（可互通，需补还）</strong>：日常开销、人情世故，可互相借用额度，下月必须从本袋额度中扣钱补回，不碰其他袋子。</p>
                </div>
            </div>
        </div>

        <!-- 空状态提示 -->
        <div id="emptyState" class="text-center py-12 text-gray-400">
            <i class="fa fa-calculator text-4xl mb-3 opacity-50"></i>
            <p>输入金额并点击计算按钮查看结果</p>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const inputNumber = document.getElementById('inputNumber');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultsGrid = document.getElementById('resultsGrid');
        const totalSum = document.getElementById('totalSum');
        const emptyState = document.getElementById('emptyState');
        const ruleContainer = document.getElementById('ruleContainer');
        
        // 乘数数组（最新比例）
        const multipliers = [0.3, 0.2, 0.2, 0.05, 0.05, 0.15, 0.05];
        // 钱袋子名称数组
        const customNames = ['应急备用金', '长期目标', '专项支出', '购物基金', '旅游基金', '日常开销', '人情世故'];
        // 钱袋子用途数组
        const bagPurposes = [
            '应对突发情况',
            '买车等长期储蓄目标',
            '特殊事项，专款专用',
            '买衣、鞋、数码设备等',
            '年度旅游开销',
            '朋友聚餐等娱乐开销',
            '家庭聚餐等人情往来'
        ];
        // 兼容Font Awesome 4.7.0的图标数组
        const bagIcons = [
            'fa-money',        // 应急备用金
            'fa-university',   // 长期目标
            'fa-credit-card',  // 专项支出
            'fa-shopping-cart',// 购物基金
            'fa-plane',        // 旅游基金
            'fa-shopping-bag', // 日常开销
            'fa-users'         // 人情世故
        ];
        // 钱袋子类别数组（核/刚/弹）
        const bagCategories = ['核', '核', '核', '刚', '刚', '弹', '弹'];
        // 新增：类别对应的样式类数组
        const bagCategoryClasses = ['category-he', 'category-he', 'category-he', 'category-gang', 'category-gang', 'category-tan', 'category-tan'];
        
        // 计算函数
        function calculate() {
            // 获取输入值并验证
            const value = parseFloat(inputNumber.value);
            if (isNaN(value)) {
                alert('请输入有效的金额！');
                return;
            }
            
            // 清空之前的结果
            resultsGrid.innerHTML = '';
            
            // 计算结果并生成卡片
            let sum = 0;
            multipliers.forEach((multiplier, index) => {
                const result = value * multiplier;
                sum += result;
                
                // 处理百分比：去除小数，格式化为“XX%”
                const percentage = (multiplier * 100) + '%';
                
                // 创建结果卡片
                const card = document.createElement('div');
                card.className = 'result-card';
                
                // 卡片内容（添加对应类别文字颜色类）
                card.innerHTML = `
                    <!-- 左上角类别标签：绑定对应文字颜色类 -->
                    <div class="card-category ${bagCategoryClasses[index]}">${bagCategories[index]}</div>
                    <div class="flex flex-col items-center">
                        <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mb-2">
                            <i class="fa ${bagIcons[index]} text-primary"></i>
                        </div>
                        <div class="text-sm font-medium text-dark mb-1 text-center">${customNames[index]}</div>
                        <div class="text-xs text-gray-500 mb-2 text-center">${percentage}</div>
                        <div class="text-xl font-semibold text-center"><i class="fa fa-yen"></i>  ${result.toFixed(2)}</div>
                        <div class="text-xs text-gray-400 mt-2 text-center leading-tight">${bagPurposes[index]}</div>
                    </div>
                `;
                
                resultsGrid.appendChild(card);
                
                // 保留原有动画效果
                setTimeout(() => {
                    card.classList.add('scale-105');
                    setTimeout(() => card.classList.remove('scale-105'), 200);
                }, index * 100);
            });
            
            // 显示总和
            totalSum.textContent = sum.toFixed(2);
            
            // 显示结果区域、隐藏空状态、显示特殊规则
            resultContainer.classList.remove('hidden');
            emptyState.classList.add('hidden');
            ruleContainer.classList.remove('hidden');
        }
        
        // 绑定事件（保留原有逻辑）
        calculateBtn.addEventListener('click', calculate);
        inputNumber.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                calculate();
            }
        });
        inputNumber.addEventListener('input', () => {
            if (inputNumber.value && !resultContainer.classList.contains('hidden')) {
                calculate();
            }
        });
    </script>
</body>
</html>
